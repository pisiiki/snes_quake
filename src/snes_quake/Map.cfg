# libSFX Memory Map (Mode 20 LoROM, 32 Mbit ROM, 128 KiB GSU RAM)

SYMBOLS {
    __STACKSIZE__: type = weak, value = $100;
    __ZPADSIZE__:  type = weak, value = $10;
    __ZNMISIZE__:  type = weak, value = $10;
    __RPADSIZE__:  type = weak, value = $100;
}

MEMORY {
    ZPAD:       start = $000000, size = __ZPADSIZE__, define = yes;
    ZNMI:       start = __ZPADSIZE__, size = __ZNMISIZE__, define = yes;
    ZPAGE:      start = __ZPADSIZE__ + __ZNMISIZE__, size = $100 - (__ZPADSIZE__ + __ZNMISIZE__), define = yes;
    LORAM:      start = $000100, size = $1f00 - __STACKSIZE__, define = yes;
    STACK:      start = $002000 - __STACKSIZE__, size = __STACKSIZE__, define = yes;
    # PLOT and expanded output occupy low bank $70. The hidden texture rows
    # host a cold helper that flat expansion restores on the next transition.
    GSURAM_TEXTURE_TAIL_CODE:start = $703800, size = $0800, define = yes;
    GSURAM_BRUSH_CODE:start = $708c00, size = $25a0, define = yes;
    GSURAM_ALIAS_FLY_CODE:start = $70aa70, size = $0730, define = yes;
    # The RAM turbulence sampler occupies the tail of the bank-$70 Q12 mirror.
    # Lookup bounds route this reserved tail through the exact ROM fallback.
    GSURAM_TURBULENCE_HOT_CODE:start = $708afc, size = $0104, define = yes;
    GSURAM_AUX_CODE:start = $70b1a0, size = $0e40, define = yes;
    GSURAM_CODE:start = $70c000, size = $4000, define = yes;
    GSURAM_T4_RASTER_CODE:start = $70db3b, size = $02f5, define = yes;
    GSURAM_T4_EDGE_PATCH:start = $70de98, size = $000f, define = yes;
    GSURAM_T4_EDGE_DEPTH_CODE:start = $70deb6, size = $001f, define = yes;
    GSURAM_T4_STAGE_CODE:start = $70ded9, size = $0042, define = yes;
    GSURAM_T4_EDGE_OUTPUT_CODE:start = $70df1b, size = $004c, define = yes;
    GSURAM_T4_FACE_DISPATCH_PATCH:start = $70d293, size = $0014, define = yes;
    GSURAM_T4_BLOCK_SELECT_CODE:start = $70e214, size = $003e, define = yes;
    GSURAM_T4_SAMPLE_WRAP_CODE:start = $70e4f1, size = $005d, define = yes;
    GSURAM_T4_SAMPLE_CODE:start = $70e7dc, size = $0028, define = yes;
    GSURAM_T4_SAMPLE_SELECT_PATCH:start = $70f68a, size = $0027, define = yes;
    GSURAM_T4_SAMPLE_AUX_CODE:start = $70f8ce, size = $015a, define = yes;
